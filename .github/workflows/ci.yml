name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub-hosted Windows runners cannot reliably install FPC for this project.
# Windows builds and platform tests remain local developer workflows.
# CI covers the portable Unix/Linux path only.

jobs:
  portable-linux:
    name: portable-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Portable isolation check
        run: |
          chmod +x tools/check_portable.sh tools/build.sh tools/test.sh
          ./tools/check_portable.sh

      - name: Build hello_lux
        run: ./tools/build.sh

      - name: Run portable tests
        run: ./tools/test.sh

      - name: Smoke-run hello_lux
        run: ./bin/hello_lux
