name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub-hosted Windows runners cannot reliably install FPC for this project.
# Windows builds remain local. CI covers portable + Unix platform paths on Linux.

jobs:
  portable-linux:
    name: portable-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Make scripts executable
        run: chmod +x tools/*.sh

      - name: Portable isolation check
        run: ./tools/check_portable.sh

      - name: Build hello_lux
        run: ./tools/build.sh hello

      - name: Run portable tests
        run: ./tools/test.sh

      - name: Build and run Unix platform tests
        run: ./tools/test_unix.sh

      - name: Build unix_demo
        run: ./tools/build.sh unix-demo

      - name: Build eventloop_unix
        run: ./tools/build.sh eventloop

      - name: Build controls_demo_unix
        run: ./tools/build.sh controls-demo

      - name: Build scroll_demo_unix
        run: ./tools/build.sh scroll-demo

      - name: Build form_demo_unix
        run: ./tools/build.sh form-demo

      - name: Smoke-run hello_lux
        run: ./bin/hello_lux

      - name: Smoke-run unix_demo under pseudo-TTY
        run: |
          # script(1) allocates a PTY so Session.Open can succeed in CI.
          sudo apt-get install -y bsdutils || true
          timeout 20s script -q -c "./bin/unix_demo" /dev/null

      - name: Smoke-run eventloop_unix under pseudo-TTY
        run: |
          # PTY required for Session.Open. Send Escape after 1s so Run exits and restores.
          sudo apt-get install -y bsdutils || true
          set +e
          timeout 15s script -q -c 'sh -c "(sleep 1; printf \"\\033\") & exec ./bin/eventloop_unix"' /dev/null
          rc=$?
          set -e
          # 0 = quit via Esc; 124 = timeout (still proves the loop started under a PTY)
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi

      - name: Smoke-run controls_demo_unix under pseudo-TTY
        run: |
          sudo apt-get install -y bsdutils || true
          set +e
          # Quit button is focusable second; send Tab then Enter after start.
          timeout 15s script -q -c 'sh -c "(sleep 1; printf \"\\t\\r\") & exec ./bin/controls_demo_unix"' /dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
